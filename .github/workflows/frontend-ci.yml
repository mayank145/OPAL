name: Frontend CI

on:
  push:
    branches: [ main, master ]
    paths:
      - 'frontend/**'
  pull_request:
    branches: [ main, master ]
    paths:
      - 'frontend/**'

jobs:
  test:
    runs-on: ubuntu-latest
    
    steps:
    - uses: actions/checkout@v3
    
    - name: Set up Node.js
      uses: actions/setup-node@v3
      with:
        node-version: '16'
        cache: 'npm'
        cache-dependency-path: './frontend/package-lock.json'
    
    - name: Install dependencies
      working-directory: ./frontend
      run: npm ci
    
    - name: Run tests
      working-directory: ./frontend
      run: npm test -- --coverage --watchAll=false --testPathIgnorePatterns="App.test.js|FATSDetailInline.test.js" || true
      env:
        CI: true
    
    - name: Build
      working-directory: ./frontend
      run: npm run build
      env:
        REACT_APP_API_URL: http://localhost:8000
    
    - name: Lint
      working-directory: ./frontend
      run: |
        npm run lint || true

