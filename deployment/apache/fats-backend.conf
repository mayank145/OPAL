# Apache Virtual Host Configuration for FATS Backend API
# Place this file in /etc/apache2/sites-available/ and enable it

<VirtualHost *:80>
    ServerName api.your-domain.com
    ServerAlias api-fats.your-domain.com
    
    # Redirect HTTP to HTTPS (uncomment after SSL setup)
    # Redirect permanent / https://api.your-domain.com/
</VirtualHost>

<VirtualHost *:443>
    ServerName api.your-domain.com
    ServerAlias api-fats.your-domain.com
    
    # SSL Configuration (adjust paths as needed)
    SSLEngine on
    SSLCertificateFile /etc/ssl/certs/your-domain.crt
    SSLCertificateKeyFile /etc/ssl/private/your-domain.key
    # SSLCertificateChainFile /etc/ssl/certs/your-domain-chain.crt
    
    # Security Headers
    Header always set X-Content-Type-Options "nosniff"
    Header always set X-Frame-Options "DENY"
    Header always set X-XSS-Protection "1; mode=block"
    Header always set Strict-Transport-Security "max-age=31536000; includeSubDomains"
    
    # Proxy Configuration for FastAPI Backend
    ProxyPreserveHost On
    ProxyRequests Off
    
    # Proxy all requests to FastAPI backend
    ProxyPass / http://127.0.0.1:8000/
    ProxyPassReverse / http://127.0.0.1:8000/
    
    # WebSocket support (if needed in future)
    RewriteEngine on
    RewriteCond %{HTTP:Upgrade} websocket [NC]
    RewriteCond %{HTTP:Connection} upgrade [NC]
    RewriteRule ^/?(.*) "ws://127.0.0.1:8000/$1" [P,L]
    
    # CORS Headers (if not handled by FastAPI)
    # Header always set Access-Control-Allow-Origin "*"
    # Header always set Access-Control-Allow-Methods "GET, POST, PUT, DELETE, OPTIONS"
    # Header always set Access-Control-Allow-Headers "Content-Type, Authorization"
    
    # Logging
    ErrorLog ${APACHE_LOG_DIR}/fats-backend-error.log
    CustomLog ${APACHE_LOG_DIR}/fats-backend-access.log combined
    
    # Timeout settings
    Timeout 300
    ProxyTimeout 300
</VirtualHost>

